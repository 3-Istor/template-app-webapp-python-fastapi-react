# deploy/values-backend.yaml
replicaCount: 1

image:
  # Points to the backend Docker image
  repository: ghcr.io/3-istor/template-app-webapp-python-fastapi-react/backend
  tag: "latest"

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000

# The backend connects to the DB and needs Vault secrets. The Vault path is
# the app's own, project-<project>/<app>: the chart derives it.
secrets:
  enabled: true
  # Names the app expects in that path, never their values: the CMP lists the
  # missing ones with a link to Vault.
  keys: []

imagePullSecrets:
  - name: app-registry

db:
  enabled: true
  name: "app_fastapi_react"
  storage: "1Gi"

# The platform runs backend/migrate (alembic upgrade head) as a Job once the
# database is Ready and before each new version starts.
migrations:
  enabled: true
  command: ["/app/migrate"]

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Same as the deploy/values-backend.yaml app-templates writes for a new app.
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

metrics:
  enabled: true
  path: /metrics

tracing:
  enabled: true
  sampleRatio: "1.0"
