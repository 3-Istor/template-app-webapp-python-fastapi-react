name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Scans of the template itself. A generated app replaces this file with
# app-templates' security.yml, after one run on its first commit.
jobs:
  trivy:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    if: github.repository == '3-Istor/template-app-webapp-python-fastapi-react'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Block fixable HIGH and CRITICAL vulnerabilities
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,vendor
          exit-code: "1"

      - name: Report vulnerabilities and secrets
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,vendor
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Upload report
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif

  # The fs scan misses base image layers. Generated apps replace this file with
  # app-templates' security.yml, so this job only guards the template itself.
  image:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    if: github.repository == '3-Istor/template-app-webapp-python-fastapi-react'
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t "scan/${{ matrix.component }}" "./${{ matrix.component }}"

      - name: Block fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.component }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
