name: CI Pipeline

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
    paths-ignore:
      - "deploy/**"
  pull_request:
    branches: [ "main" ]
    # labeled/unlabeled re-run the migration lint when migration:breaking changes
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    paths-ignore:
      - "deploy/**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests
        run: |
          cd backend
          export PYTHONPATH=$PYTHONPATH:.
          pytest

  migration-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt squawk-cli==2.68.0

      - name: Find the last revision already on the base branch
        id: base
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          if [ -f ../base/backend/alembic.ini ]; then
            echo "revision=$(cd ../base/backend && alembic heads | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint new migrations (rule M-5)
        env:
          SINCE: ${{ steps.base.outputs.revision }}
          BREAKING_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'migration:breaking') }}
        run: |
          cd backend
          python scripts/lint_migrations.py ${SINCE:+--since "$SINCE"} --out ../migration-sql
          if [ -z "$(ls ../migration-sql)" ]; then
            echo "No new migration."
            exit 0
          fi
          if squawk ../migration-sql/*.sql; then
            exit 0
          fi
          if [ "$BREAKING_APPROVED" = "true" ]; then
            echo "::warning::Breaking migration accepted by the migration:breaking label. The release needs a project admin approval in the CMP."
            exit 0
          fi
          echo "::error::This migration would break the version currently running. Split it as described in README > Migrations, or add the migration:breaking label."
          exit 1

  frontend-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          
      - name: Install dependencies
        run: |
          cd frontend
          npm install
          
      - name: Build frontend
        run: |
          cd frontend
          npm run build

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a released version
        # A version is built once: staging runs it, then the CMP promotes that
        # exact image to prod. Rebuilding under the same tag would put an
        # image nobody tested behind a name that was.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}/${{ matrix.component }}:${GITHUB_REF_NAME#v}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "::error::$image already exists. Push a new tag (the next -rc.N) instead of moving this one."
            exit 1
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Component image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}