name: CI Pipeline

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
    paths-ignore:
      - "deploy/**"
  pull_request:
    branches: [ "main" ]
    # labeled/unlabeled re-run the migration lint when migration:breaking changes
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    paths-ignore:
      - "deploy/**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-test:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    steps:
      - uses: actions/checkout@v7

      # Tests run inside the image, so a base image bump is tested on the Python that ships.
      - name: Build the backend image
        run: docker build -t backend ./backend

      - name: Run tests
        run: docker run --rm backend python -m pytest -q

  migration-lint:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt squawk-cli==2.68.0

      - name: Find the last revision already on the base branch
        id: base
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          if [ -f ../base/backend/alembic.ini ]; then
            echo "revision=$(cd ../base/backend && alembic heads | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint new migrations (rule M-5)
        env:
          SINCE: ${{ steps.base.outputs.revision }}
          BREAKING_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'migration:breaking') }}
        run: |
          cd backend
          python scripts/lint_migrations.py ${SINCE:+--since "$SINCE"} --out ../migration-sql
          if [ -z "$(ls ../migration-sql)" ]; then
            echo "No new migration."
            exit 0
          fi
          if squawk ../migration-sql/*.sql; then
            exit 0
          fi
          if [ "$BREAKING_APPROVED" = "true" ]; then
            echo "::warning::Breaking migration accepted by the migration:breaking label. The release needs a project admin approval in the CMP."
            exit 0
          fi
          echo "::error::This migration would break the version currently running. Split it as described in README > Migrations, or add the migration:breaking label."
          exit 1

  frontend-build-check:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the frontend image
        run: docker build ./frontend

  docker-build-and-push:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    needs: [backend-test, frontend-build-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a released version
        # A version is built once: staging runs it, then the CMP promotes that
        # exact image to prod. Rebuilding under the same tag would put an
        # image nobody tested behind a name that was.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}/${{ matrix.component }}:${GITHUB_REF_NAME#v}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "::error::$image already exists. Push a new tag (the next -rc.N) instead of moving this one."
            exit 1
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.component }}
          # Without this, metadata-action also tags every non-prerelease semver as latest.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Component image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # Merged by the workflow once the jobs above pass: GitHub auto-merge would need a
  # repo setting and branch protection that generated repos do not have.
  dependabot-merge:
    runs-on: ${{ fromJSON(vars.CNP_CI_RUNS_ON || '["self-hosted","Linux","X64"]') }}
    needs: [backend-test, migration-lint, frontend-build-check]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      - name: Merge patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}