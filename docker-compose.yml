services:
  backend:
    build: ./backend
    image: ghcr.io/3-istor/template-app-webapp-python-fastapi-react/backend:latest
    container_name: fastapi-backend
    ports:
      - "8081:8000"
    volumes:
      - ./backend:/app
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: 1
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Same command the platform runs as a PreSync Job before each release.
  migrate:
    build: ./backend
    image: ghcr.io/3-istor/template-app-webapp-python-fastapi-react/backend:latest
    command: ["/app/migrate"]
    volumes:
      - ./backend:/app
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
        required: false

  frontend:
    # Local dev runs the vite dev server for hot reload; the image itself
    # serves the static build with nginx.
    build:
      context: ./frontend
      target: build
    command: ["npm", "run", "dev"]
    image: ghcr.io/3-istor/template-app-webapp-python-fastapi-react/frontend:latest
    container_name: react-frontend
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: postgres-db
    profiles:
      - postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-app_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
